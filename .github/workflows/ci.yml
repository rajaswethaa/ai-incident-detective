
name: AI Incident Detective CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q log_analyzer/app log_generation scripts start_server.py

      - name: Run log evaluation
        run: python scripts/evaluate.py

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t ai-incident-detective .
